name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - demo_pipeline
    status:
      - success  # Ensures CD runs only if CI succeeds

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Install Docker Compose
        run: |
          sudo apt-get install -y docker-compose || true

      - name: Login to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: sudo docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"

      - name: Stop and Remove Old `pict_backend_live` Container
        run: |
          sudo docker stop pict_backend_live || true
          sudo docker rm pict_backend_live || true

      - name: Remove Unused Docker Images
        run: sudo docker image prune -f

      - name: Remove Old Docker Image
        run: sudo docker rmi nishchaybhardwaj/pict_backend_live:latest || true

      - name: Pull the Latest Docker Image from Docker Hub
        run: sudo docker pull nishchaybhardwaj/pict_backend_live:latest

      - name: Start New `pict_backend_live` Container
        run: |
          sudo docker run -d --name pict_backend_live -p 8081:5000 --restart unless-stopped \
          nishchaybhardwaj/pict_backend_live:latest
