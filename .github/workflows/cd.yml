name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted

    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Download test results
        continue-on-error: true  # Prevents failure if the artifact is missing
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage/

      - name: Check test coverage
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "No coverage report found, skipping test coverage check."
            exit 0
          fi
          
          COVERAGE=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Test coverage below 80%"
            exit 1
          fi

      - name: Install Docker Compose
        run: |
          sudo apt-get update && sudo apt-get install -y docker-compose || true

      - name: Ensure Docker is Installed
        run: |
          if ! command -v docker &> /dev/null; then
            echo "Docker not found. Installing..."
            sudo apt-get install -y docker.io
          fi

      - name: Login to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "$DOCKER_PASSWORD" | sudo docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Stop and Remove Old Container
        run: |
          sudo docker stop pict_backend_live || true
          sudo docker rm pict_backend_live || true

      - name: Remove Unused Docker Images
        run: sudo docker image prune -f

      - name: Remove Old Docker Image
        run: sudo docker rmi nishchaybhardwaj/pict_backend_live:latest || true

      - name: Pull the Latest Docker Image
        run: sudo docker pull nishchaybhardwaj/pict_backend_live:latest

      - name: Start New Container
        run: |
          sudo docker run -d --name pict_backend_live -p 8081:5000 --restart unless-stopped \
          nishchaybhardwaj/pict_backend_live:latest
